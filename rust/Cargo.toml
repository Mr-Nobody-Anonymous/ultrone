[package]
name = "ultrone-plugin-runtime"
version = "1.0.0"
edition = "2021"
description = "ULTRONE plugin runtime — memory-safe, high-performance plugin execution"
license = "MIT"

[lib]
name = "ultrone_plugin_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
pyo3 = { version = "0.21", features = ["extension-module"], optional = true }

[features]
default = ["python-bindings"]
python-bindings = ["pyo3"]

[[bin]]
name = "ultrone-plugin-server"
path = "src/bin/server.rs"
name: Canonical Benchmark Regression Gate

on:
  push:
    paths:
      - "core/**"
      - "ultrone_hitl/**"
      - "benchmarks/canonical/**"
      - "sim/fault_injection.py"
      - ".github/workflows/canonical-benchmark.yml"
  pull_request:
    paths:
      - "core/**"
      - "ultrone_hitl/**"
      - "benchmarks/canonical/**"
      - "sim/fault_injection.py"

jobs:
  benchmark-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
      - name: Run HITL lifecycle + fault injection tests
        run: |
          python -m pytest tests/test_hitl_lifecycle.py tests/test_fault_injection.py tests/test_core_pipeline.py tests/test_audit_store.py -q
      - name: Canonical benchmark regression gate (fails on regression)
        run: python -m benchmarks.canonical --output results.json

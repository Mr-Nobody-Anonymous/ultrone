name: ULTRONE Research Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install fastapi uvicorn pydantic
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run existing tests
        run: |
          python -m pytest tests/ --tb=short -q

      - name: Run research platform tests
        run: |
          python -m pytest tests/test_knowledge_engine.py tests/test_research_db.py tests/test_research_division.py tests/test_self_improvement.py tests/test_plugin_sdk.py tests/test_extension_log.py -v --tb=short

      - name: Generate coverage report
        run: |
          python -m pytest --cov=knowledge_engine --cov=research_db --cov=research_division --cov=self_improvement --cov=plugin_sdk --cov=extension_log --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linter
        run: pip install flake8 black mypy
      - name: Run flake8
        run: flake8 knowledge_engine/ research_db/ research_division/ self_improvement/ plugin_sdk/ extension_log/ --max-line-length=120 --extend-ignore=E203,W503
      - name: Run black check
        run: black --check knowledge_engine/ research_db/ research_division/ self_improvement/ plugin_sdk/ extension_log/

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f infra/docker/Dockerfile.research -t ultrone-research:latest .
      - name: Run container smoke test
        run: docker run --rm ultrone-research:latest python -c "from knowledge_engine import KnowledgeMemoryManager; print('OK')"
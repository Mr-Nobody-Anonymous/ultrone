name: ULTRONE Research Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stdlib-shadowing regression guard
        run: |
          python -c "import types, json, logging, math, time; assert hasattr(types, 'ModuleType'), 'stdlib types shadowed'"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps:${{ github.workspace }}/packages/core:${{ github.workspace }}/packages/cognition:${{ github.workspace }}/packages/agents:${{ github.workspace }}/packages/knowledge:${{ github.workspace }}/packages/orchestration:${{ github.workspace }}/packages/runtime:${{ github.workspace }}/packages/safety:${{ github.workspace }}/packages/observability:${{ github.workspace }}/packages/transport:${{ github.workspace }}/research:${{ github.workspace }}/simulation:${{ github.workspace }}/vendor:${{ github.workspace }}/data
        run: |
          python -m pytest tests/ --tb=short -q

      - name: Generate coverage report
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps:${{ github.workspace }}/packages/core:${{ github.workspace }}/packages/cognition:${{ github.workspace }}/packages/agents:${{ github.workspace }}/packages/knowledge:${{ github.workspace }}/packages/orchestration:${{ github.workspace }}/packages/runtime:${{ github.workspace }}/packages/safety:${{ github.workspace }}/packages/observability:${{ github.workspace }}/packages/transport:${{ github.workspace }}/research:${{ github.workspace }}/simulation:${{ github.workspace }}/vendor:${{ github.workspace }}/data
        run: |
          python -m pytest --cov=packages/knowledge/knowledge_engine --cov=research/research_db --cov=research/research_division --cov=packages/cognition/self_improvement --cov=packages/agents/plugin_sdk --cov=packages/core/extension_log --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install linter
        run: pip install flake8==7.3.0 black==26.5.1 mypy
      - name: Stdlib-shadowing regression guard
        run: |
          python -c "import types, json, logging, math, time; assert hasattr(types, 'ModuleType'), 'stdlib types shadowed'"
      - name: Run flake8
        run: flake8 packages/knowledge/knowledge_engine/ research/research_db/ research/research_division/ packages/cognition/self_improvement/ packages/agents/plugin_sdk/ packages/core/extension_log/ --max-line-length=120 --extend-ignore=E203,W503
      - name: Run black check
        run: black --check packages/knowledge/knowledge_engine/ research/research_db/ research/research_division/ packages/cognition/self_improvement/ packages/agents/plugin_sdk/ packages/core/extension_log/

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f infra/docker/Dockerfile.research -t ultrone-research:latest .
      - name: Run container smoke test
        run: docker run --rm ultrone-research:latest python -c "from knowledge_engine import KnowledgeMemoryManager; print('OK')"

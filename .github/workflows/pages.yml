name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "apps/globe/**"
      - "packages/geospatial/**"
      - "scripts/export_geo_snapshot.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/globe/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate ULTRONE demo snapshot
        run: |
          pip install numpy
          python scripts/export_geo_snapshot.py apps/globe/public/ultrone-demo-snapshot.json

      - name: Build Global Eye globe
        working-directory: apps/globe
        run: |
          npm ci
          npm run build:pages

      - name: Stage site (showcase + globe)
        run: |
          rm -rf site
          cp -r docs site
          mkdir -p site/globe
          cp -r apps/globe/dist/* site/globe/
          ls site site/globe | head -n 20

      # The globe build is mounted at /ultrone/globe/, so every asset it
      # references must exist under site/globe/. This is what caught the Cesium
      # runtime being copied one directory too deep.
      - name: Verify staged asset paths
        run: node apps/globe/scripts/qa-pages-assets.mjs --dist site/globe --prefix /ultrone/globe/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

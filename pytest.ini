[pytest]
addopts = --ignore=scripts
testpaths = tests
; ULTRONE is a monorepo: packages live under apps/, packages/<area>/,
; research/, simulation/ and vendor/ while keeping their original top-level
; import names. pythonpath puts every bucket on sys.path for test runs.
pythonpath = .
             apps
             packages/core
             packages/cognition
             packages/agents
             packages/knowledge
             packages/orchestration
             packages/runtime
             packages/safety
             packages/observability
             packages/transport
             research
             simulation
             vendor
             data
filterwarnings =
    ignore:The 'app' shortcut is now deprecated.*:DeprecationWarning:httpx
    ignore:Please use `import python_multipart` instead.*:PendingDeprecationWarning
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning
    ignore:websockets\.legacy is deprecated.*:DeprecationWarning
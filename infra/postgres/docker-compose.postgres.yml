# PostgreSQL service for ULTRONE
version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ultrone
      POSTGRES_USER: ultrone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ultrone_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultrone"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ultrone.fullname" . }}-grafana-datasources
  labels:
    {{- include "ultrone.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
    datasources:
    {{- if .Values.grafana.datasources.prometheus.enabled }}
      - name: Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: {{ .Values.grafana.datasources.prometheus.url }}
        isDefault: true
        editable: false
    {{- end }}
    {{- if .Values.grafana.datasources.loki.enabled }}
      - name: Loki
        type: loki
        access: proxy
        orgId: 1
        url: {{ .Values.grafana.datasources.loki.url }}
        editable: false
    {{- end }}
{{- end }}
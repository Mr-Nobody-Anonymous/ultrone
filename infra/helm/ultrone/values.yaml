# ULTRONE Helm Chart Values
# Default values for the ULTRONE platform deployment.

# Global settings applied to all resources
global:
  nameOverride: ""
  fullnameOverride: ""
  namespace: ultrone
  imagePullSecrets: []
  imageRegistry: ""
  environment: production

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/part-of: ultrone
  app.kubernetes.io/version: "2.0.0"

# Image settings shared across services
image:
  registry: ghcr.io
  repository: mr-nobody-anonymous/ultrone
  tag: latest
  pullPolicy: IfNotPresent

# ------------------------------------------------------------------
# argus-api - FastAPI operational command server
# ------------------------------------------------------------------
api:
  enabled: true
  name: argus-api
  replicaCount: 2
  image:
    registry: ""
    repository: argus-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/websocket-services: "argus-api"
    hosts:
      - host: api.ultrone.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: ultrone-api-tls
    #    hosts:
    #      - api.ultrone.local
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  livenessProbe:
    path: /health
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    path: /health
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  env:
    ARGUS_DB_PATH: /data/argus.db
    REDIS_HOST: redis
    QDRANT_HOST: qdrant
    LOG_LEVEL: INFO
  envFromSecrets:
    - name: ultrone-secrets
      optional: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ultrone-data
    - name: snapshots
      persistentVolumeClaim:
        claimName: ultrone-snapshots
    - name: videos
      persistentVolumeClaim:
        claimName: ultrone-videos
  volumeMounts:
    - name: data
      mountPath: /data
    - name: snapshots
      mountPath: /snapshots
    - name: videos
      mountPath: /videos
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - api
            topologyKey: kubernetes.io/hostname
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  gpu:
    enabled: false
    # resources:
    #   limits:
    #     nvidia.com/gpu: 1

# ------------------------------------------------------------------
# argus-worker - Background processing workers
# ------------------------------------------------------------------
worker:
  enabled: true
  name: argus-worker
  replicaCount: 2
  image:
    registry: ""
    repository: argus-worker
    tag: latest
    pullPolicy: IfNotPresent
  service:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  env:
    ARGUS_DB_PATH: /data/argus.db
    REDIS_HOST: redis
    LOG_LEVEL: INFO
  envFromSecrets:
    - name: ultrone-secrets
      optional: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ultrone-data
    - name: snapshots
      persistentVolumeClaim:
        claimName: ultrone-snapshots
  volumeMounts:
    - name: data
      mountPath: /data
    - name: snapshots
      mountPath: /snapshots
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - worker
            topologyKey: kubernetes.io/hostname
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

# ------------------------------------------------------------------
# frontend - React/Vite dashboard
# ------------------------------------------------------------------
frontend:
  enabled: true
  name: frontend
  replicaCount: 2
  image:
    registry: ""
    repository: ultrone-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    hosts:
      - host: ultrone.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: ultrone-frontend-tls
    #    hosts:
    #      - ultrone.local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  env:
    VITE_API_URL: /api
    VITE_WS_URL: /ws
  envFromSecrets:
    - name: ultrone-secrets
      optional: true
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - frontend
            topologyKey: kubernetes.io/hostname

# ------------------------------------------------------------------
# redis - Cache and message broker
# ------------------------------------------------------------------
redis:
  enabled: true
  name: redis
  replicaCount: 1
  image:
    registry: docker.io
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  password: ""  # must be set via --set or secret

# ------------------------------------------------------------------
# qdrant - Vector database
# ------------------------------------------------------------------
qdrant:
  enabled: true
  name: qdrant
  replicaCount: 1
  image:
    registry: docker.io
    repository: qdrant/qdrant
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6333
    targetPort: 6333
    grpcPort: 6334
    grpcTargetPort: 6334
    apiPort: 6333
    apiTargetPort: 6333
    annotations: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  livenessProbe:
    path: /healthz
    port: 6333
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    path: /healthz
    port: 6333
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
                  - arm64

# ------------------------------------------------------------------
# postgres - TimescaleDB for metrics/time-series
# ------------------------------------------------------------------
postgres:
  enabled: true
  name: postgres
  replicaCount: 1
  image:
    registry: docker.io
    repository: timescale/timescaledb
    tag: 2-pg16
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
    annotations: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  database:
    name: ultrone
    user: ultrone
    password: ""  # must be set via --set or secret
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  initContainers:
    - name: init-chmod-data
      image: busybox:1.36
      command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data"]
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data

# ------------------------------------------------------------------
# mediamtx - RTSP/RTMP/HLS/WebRTC streaming server
# ------------------------------------------------------------------
mediamtx:
  enabled: true
  name: mediamtx
  replicaCount: 1
  image:
    registry: docker.io
    repository: bluenviron/mediamtx
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8554
    targetPort: 8554
    rtmpPort: 1935
    rtmpTargetPort: 1935
    hlsPort: 8888
    hlsTargetPort: 8888
    webrtcPort: 8889
    webrtcTargetPort: 8889
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  config:
    logLevel: info
    api:
      enabled: true
    # Additional MediaMTX config can be provided via configmap
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ------------------------------------------------------------------
# grafana - Observability dashboard
# ------------------------------------------------------------------
grafana:
  enabled: true
  name: grafana
  replicaCount: 1
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: grafana.ultrone.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  admin:
    user: admin
    password: ""  # must be set via --set or secret
  env:
    GF_SECURITY_ADMIN_USER: admin
    GF_USERS_ALLOW_SIGN_UP: "false"
    GF_ANALYTICS_REPORTING_ENABLED: "false"
  datasources:
    prometheus:
      enabled: true
      url: http://prometheus:9090
    loki:
      enabled: true
      url: http://loki:3100
  dashboards:
    enabled: true
    providerName: default

# ------------------------------------------------------------------
# prometheus - Metrics collection
# ------------------------------------------------------------------
prometheus:
  enabled: true
  name: prometheus
  replicaCount: 1
  image:
    registry: docker.io
    repository: prom/prometheus
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
    targetPort: 9090
    annotations: {}
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  retention: 15d
  scrapeInterval: 30s
  evaluationInterval: 30s
  additionalScrapeConfigs: {}
  rules: {}
  alerts:
    enabled: false

# ------------------------------------------------------------------
# loki - Log aggregation
# ------------------------------------------------------------------
loki:
  enabled: true
  name: loki
  replicaCount: 1
  image:
    registry: docker.io
    repository: grafana/loki
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3100
    targetPort: 3100
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  config:
    auth_enabled: false
    limits_config:
      allow_structured_metadata: true
    compactor:
      working_directory: /loki/compactor

# ------------------------------------------------------------------
# Storage
# ------------------------------------------------------------------
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  # Global PVC settings
  data:
    size: 20Gi
  snapshots:
    size: 50Gi
  videos:
    size: 50Gi
  retention:
    enabled: true
    # Time in days to retain data

# ------------------------------------------------------------------
# Service Accounts
# ------------------------------------------------------------------
serviceAccounts:
  create: true
  annotations: {}
  name: ""

# ------------------------------------------------------------------
# RBAC
# ------------------------------------------------------------------
rbac:
  create: true
  # Whether to create ClusterRole or namespaced Role
  clusterWide: false

# ------------------------------------------------------------------
# Network Policies
# ------------------------------------------------------------------
networkPolicies:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8000

# ------------------------------------------------------------------
# Ingress
# ------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "argus-api"
  hosts:
    - host: ultrone.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: ultrone-tls
  #    hosts:
  #      - ultrone.local

# ------------------------------------------------------------------
# Testing
# ------------------------------------------------------------------
test:
  enabled: true

# ------------------------------------------------------------------
# Auto-Update
# ------------------------------------------------------------------
autoupdate:
  enabled: false
  schedule: "0 0 * * *"  # Daily at midnight
  checkInterval: 24h
  autoUpdate: false  # Set to true to enable automatic updates
  githubRepo: "Mr-Nobody-Anonymous/ultrone"
  githubToken: ""  # GitHub personal access token (optional, for higher rate limits)
  image:
    registry: docker.io
    repository: python
    tag: "3.11-slim"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ------------------------------------------------------------------
# Extra manifests to include (e.g. HorizontalPodAutoscaler for all)
# ------------------------------------------------------------------
extraManifests: []

[project]
name = "ultrone"
version = "3.0.0-EVO"
description = "Multi-Domain AI Architecture for Battlefield Simulation with Self-Evolution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ultrone AI Team"}
]
keywords = ["ai", "military", "simulation", "battlefield", "evolution", "multi-domain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "PyYAML>=6.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# ULTRONE is a monorepo. Packages keep their original top-level import names
# but live inside semantic buckets; list every bucket here so an editable
# install exposes all of them.
namespaces = false
where = [
    ".",
    "apps",
    "packages/core",
    "packages/cognition",
    "packages/agents",
    "packages/knowledge",
    "packages/orchestration",
    "packages/runtime",
    "packages/safety",
    "packages/observability",
    "packages/transport",
    "research",
    "simulation",
    "vendor",
    "data",
]